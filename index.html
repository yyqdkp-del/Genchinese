<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>根·中文 | 清迈陪读家庭的中文解决方案</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --navy:#1A3C5E; --orange:#E8892A; --green:#4A7C59;
            --bg:#FAFAFA; --mint:#F0F9F4; --warm:#FFF9F2; --white:#fff;
            --text:#1A2B3C; --muted:#6B8090; --border:#E2F2E9;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); font-family:'Noto Sans SC', sans-serif; color:var(--text); overflow-x:hidden; line-height:1.6; }
        h1, h2, h3 { font-family:'Noto Serif SC', serif; color:var(--navy); }

        /* NAV */
        nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:14px 24px;
            display:flex; align-items:center; justify-content:space-between;
            background:rgba(255,255,255,0.9); backdrop-filter:blur(10px);
            border-bottom:1px solid rgba(0,0,0,0.05); }
        .nav-logo { font-family:'Noto Serif SC', serif; font-size:20px; font-weight:900; color:var(--navy); }
        .nav-logo span { color:var(--orange); }
        .nav-cta { background:var(--orange); color:#fff; border-radius:20px; padding:8px 18px; font-size:13px; font-weight:700; text-decoration:none; }

        /* HERO */
        .hero { min-height:100vh; position:relative; display:flex; align-items:center; padding:100px 8% 60px; }
        .hero-bg { position:absolute; inset:0; background-image:url('IMG_0570.png'); background-size:cover; background-position:center; z-index:0; }
        .hero-overlay { position:absolute; inset:0; background:linear-gradient(to right, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0.7) 50%, transparent 100%); z-index:1; }
        .hero-content { position:relative; z-index:2; max-width:550px; }
        .hero-title { font-size:3rem; font-weight:900; line-height:1.2; margin-bottom:20px; }
        .hero-btn { display:inline-block; padding:18px 36px; background:var(--orange); color:#fff; border-radius:50px; text-decoration:none; font-weight:700; box-shadow:0 10px 20px rgba(232,137,42,0.3); }

        /* SECTIONS */
        section { padding:80px 8%; }
        .sec-title { font-size:2rem; margin-bottom:40px; text-align:center; }

        /* DECODER */
        .decoder-box { background:var(--navy); padding:50px 30px; border-radius:30px; color:#fff; text-align:center; margin:40px 0; }
        .dec-input-wrap { position:relative; max-width:400px; margin:0 auto; }
        .dec-input { width:100%; padding:15px 25px; border-radius:30px; border:none; font-size:1.1rem; }
        .dec-btn { background:var(--orange); color:#fff; padding:12px 30px; border-radius:30px; border:none; margin-top:20px; font-weight:700; cursor:pointer; }
        
        /* RESULT CARD */
        #decCard { display:none; background:#fff; color:var(--text); padding:30px; border-radius:20px; margin-top:30px; text-align:left; border:2px solid var(--orange); }
        .char-display { font-size:3rem; text-align:center; color:var(--orange); font-weight:900; margin-bottom:20px; }

        /* QR CARDS */
        .qr-container { display:flex; gap:30px; justify-content:center; flex-wrap:wrap; margin-top:40px; }
        .qr-card { background:#fff; padding:20px; border-radius:20px; text-align:center; box-shadow:0 5px 15px rgba(0,0,0,0.05); width:220px; border-top:4px solid var(--orange); }
        .qr-img { width:100%; height:auto; border-radius:10px; margin-bottom:15px; }
        .qr-label { font-weight:700; color:var(--navy); font-size:14px; }

        @media (max-width:600px) {
            .hero-title { font-size:2rem; }
            .hero-overlay { background: rgba(255,255,255,0.85); }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-logo"><span>～</span>根<span>·</span>中文</div>
    <a href="https://gen-fawn.vercel.app/assess.html" class="nav-cta">免费测评 →</a>
</nav>

<section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1 class="hero-title">在清迈，把中文交给这位"数字保姆"</h1>
        <p style="font-size:1.2rem; margin-bottom:30px;">每天10分钟，让汉字回归字理逻辑。</p>
        <a href="https://gen-fawn.vercel.app/assess.html" class="hero-btn">立即开始免费能力测评 →</a>
    </div>
</section>

<section class="decoder-section">
    <h2 class="sec-title">汉字解码器盲盒</h2>
    <div class="decoder-box">
        <div class="dec-input-wrap">
            <input type="text" id="charInput" class="dec-input" placeholder="输入一个汉字，如「闻」">
            <button class="dec-btn" onclick="decodeChar()">🔓 开启解码</button>
        </div>
        <div id="decCard">
            <div class="char-display" id="resChar"></div>
            <div id="resLogic" style="margin-bottom:15px; font-weight:700;"></div>
            <p id="resScript" style="color:var(--muted); font-size:0.9rem;"></p>
        </div>
    </div>
</section>

<section class="finale">
    <h2 class="sec-title">联系官方顾问</h2>
    <div class="qr-container">
        <div class="qr-card">
            <img src="IMG_6756.jpeg" alt="WeChat" class="qr-img">
            <p class="qr-label">💬 官方微信顾问</p>
        </div>
        <div class="qr-card">
            <img src="IMG_6757.jpeg" alt="LINE" class="qr-img">
            <p class="qr-label">🟢 官方 LINE 顾问</p>
        </div>
    </div>
</section>

<script>
    const FB = {
        '闻': { logic: '门 + 耳', script: '耳朵贴在门上听，就是"闻"。古人通过门缝听世界的故事。' },
        '休': { logic: '人 + 木', script: '人靠在树木旁，就是"休"。累了就要找棵大树歇歇脚。' },
        '明': { logic: '日 + 月', script: '太阳和月亮在一起，就是最明亮的光芒。' }
    };

    function decodeChar() {
        const val = document.getElementById('charInput').value.trim();
        if(!val) return;
        
        const card = document.getElementById('decCard');
        const data = FB[val] || { logic: val + ' 的奥秘', script: '这个字藏着深厚的字理逻辑，添加顾问解锁完整脚本。' };
        
        document.getElementById('resChar').innerText = val;
        document.getElementById('resLogic').innerText = '逻辑：' + data.logic;
        document.getElementById('resScript').innerText = '建议台词：' + data.script;
        
        card.style.display = 'block';
    }
</script>

</body>
</html>
